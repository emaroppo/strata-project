[project]
name = "strata-project"
version = "0.1.0"
description = "A project is the job: what it labels, from which catalog, with what model, as a file"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomlkit>=0.13",
    "strata-labels>=0.1,<0.2",
    "strata-catalog>=0.1,<0.2",
    "strata-modelling>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]


# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
