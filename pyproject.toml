[project]
name = "strata-project"
version = "0.1.0"
description = "A project is the job: what it labels, from which catalog, with what model, as a file"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomlkit>=0.13",
    "strata-labels>=0.1,<0.2",
    "strata-catalog>=0.1,<0.2",
    "strata-modelling>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv.sources]
strata-labels = { workspace = true }
strata-catalog = { workspace = true }
strata-modelling = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
